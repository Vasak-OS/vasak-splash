# Drop-in de mkinitcpio que mete `vasak-splash` en el array de HOOKS.
#
# OJO: un drop-in de mkinitcpio **reemplaza** el array entero, no agrega. Por eso
# acá va la línea completa, no sólo `vasak-splash`. Esta es la base estándar de
# un VasakOS instalado; si una máquina tiene un HOOKS distinto (por ejemplo disco
# cifrado, que suma `encrypt`), hay que ajustar esta línea a mano —y el splash,
# en v1, no cubre el prompt de LUKS: ahí queda el pedido de frase de cryptsetup
# en texto.
#
# `vasak-splash` va justo **después de `kms`**: ése es el hook que carga el
# driver de modesetting, así que recién después hay un `/dev/dri/card*` donde el
# daemon pueda tomar el DRM y dibujar.
HOOKS=(base udev autodetect microcode modconf kms vasak-splash keyboard keymap consolefont block filesystems fsck)
